services:
  db:
    image: postgres:16.1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio_chat
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - portfolio_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/portfolio_chat?schema=public
      NODE_ENV: development
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - portfolio_network
    command: npm start
    restart: on-failure

volumes:
  postgres_data:
  

networks:
  portfolio_network:
    driver: bridge
